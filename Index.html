​<script>
class RetroAudio {
constructor() {
this.ctx = null;
}
​init() {
if (!this.ctx) {
this.ctx = new (window.AudioContext || window.webkitAudioContext)();
}
}
​playMelody(notes, tempo = 120, type = 'square') {
if (!this.ctx) return;
const noteDuration = 60 / tempo;
​notes.forEach((note, index) => {
if (note.freq === 0) return;
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
​osc.type = type;
osc.frequency.value = note.freq;
​const startTime = this.ctx.currentTime + (index * noteDuration * (note.dur || 1));
const duration = noteDuration * (note.dur || 0.8);
​gain.gain.setValueAtTime(0.12, startTime);
gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
​osc.connect(gain);
gain.connect(this.ctx.destination);
​osc.start(startTime);
osc.stop(startTime + duration);
});
}
​playLevelStartMelody() {
const C4 = 261.63, E4 = 329.63, G4 = 392.00, A4 = 440.00, D5 = 587.33, E5 = 659.25;
const tune = [
{ freq: C4, dur: 0.5 }, { freq: E4, dur: 0.5 }, { freq: G4, dur: 0.5 },
{ freq: G4, dur: 0.4 }, { freq: E4, dur: 0.4 }, { freq: A4, dur: 0.5 },
{ freq: D5, dur: 0.5 }, { freq: E5, dur: 1.2 }
];
this.playMelody(tune, 210, 'square');
}
​playLevelClearMelody() {
const G4 = 392.00, C5 = 523.25, E5 = 659.25, G5 = 783.99;
const tune = [
{ freq: G4, dur: 0.4 }, { freq: C5, dur: 0.4 }, { freq: E5, dur: 0.4 }, { freq: G5, dur: 0.8 },
{ freq: E5, dur: 0.4 }, { freq: G5, dur: 1.2 }
];
this.playMelody(tune, 220, 'triangle');
}
​playFinalVictoryMelody() {
const C4 = 261.63, E4 = 329.63, G4 = 392.00, C5 = 523.25, E5 = 659.25, G5 = 783.99, A5 = 880.00, C6 = 1046.50;
const tune = [
{ freq: C4, dur: 0.4 }, { freq: E4, dur: 0.4 }, { freq: G4, dur: 0.4 }, { freq: C5, dur: 0.8 },
{ freq: G4, dur: 0.4 }, { freq: C5, dur: 0.8 }, { freq: E5, dur: 0.4 }, { freq: G5, dur: 0.8 },
{ freq: E5, dur: 0.4 }, { freq: A5, dur: 0.6 }, { freq: G5, dur: 0.6 }, { freq: C6, dur: 2.0 }
];
this.playMelody(tune, 190, 'square');
}
​playJump() {
if (!this.ctx) return;
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.type = 'square';
osc.frequency.setValueAtTime(160, this.ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.15);
gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.start();
osc.stop(this.ctx.currentTime + 0.15);
}
​playHit() {
if (!this.ctx) return;
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(140, this.ctx.currentTime);
osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.1);
gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.start();
osc.stop(this.ctx.currentTime + 0.1);
}
​playPowerup() {
if (!this.ctx) return;
const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
notes.forEach((freq, idx) => {
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.type = 'triangle';
osc.frequency.value = freq;
gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.05);
gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + (idx + 1) * 0.05);
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.start(this.ctx.currentTime + idx * 0.05);
osc.stop(this.ctx.currentTime + (idx + 1) * 0.05);
});
}
​playShoot() {
if (!this.ctx) return;
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.type = 'square';
osc.frequency.setValueAtTime(850, this.ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.1);
gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.start();
osc.stop(this.ctx.currentTime + 0.1);
}
​playEnemyDie() {
if (!this.ctx) return;
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(320, this.ctx.currentTime);
osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.2);
gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.start();
osc.stop(this.ctx.currentTime + 0.2);
}
​playFireworkBoom() {
if (!this.ctx) return;
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(220, this.ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.start();
osc.stop(this.ctx.currentTime + 0.3);
}
}
​const audio = new RetroAudio();

const ctx = canvas.getContext('2d');
​const GAME_STATES = { MENU: 0, PLAYING: 1, LEVEL_CLEAR: 2, GAMEOVER: 3, WIN: 4 };
let currentState = GAME_STATES.MENU;
​let score = 0;
let currentLevel = 1;
const maxLevels = 3;

​class FireworkParticle {
constructor(x, y, color) {
this.x = x;
this.y = y;
this.color = color;
const angle = Math.random() * Math.PI * 2;
const speed = 2 + Math.random() * 6;
this.vx = Math.cos(angle) * speed;
this.vy = Math.sin(angle) * speed;
this.alpha = 1.0;
this.decay = 0.015 + Math.random() * 0.02;
this.gravity = 0.12;
}
​update() {
this.x += this.vx;
this.y += this.vy;
this.vy += this.gravity;
this.vx *= 0.98;
this.alpha -= this.decay;
}
​draw(ctx) {
ctx.save();
ctx.globalAlpha = Math.max(0, this.alpha);
ctx.fillStyle = this.color;
ctx.shadowColor = this.color;
ctx.shadowBlur = 8;
ctx.fillRect(this.x, this.y, 4, 4);
ctx.restore();
}
}
​let fireworkParticles = [];
function createFireworkExplosion(x, y) {
const colors = ['#00ff66', '#ff0055', '#00ffff', '#ffff00', '#ff00ff', '#ffffff'];
const color = colors[Math.floor(Math.random() * colors.length)];
audio.playFireworkBoom();
​for (let i = 0; i < 45; i++) {
fireworkParticles.push(new FireworkParticle(x, y, color));
}
}
​const matrixChars = "0101010101EWOKMATRIXATARI8BIT";
const rainDrops = Array.from({ length: 40 }, () => ({
x: Math.random() * 3500,
y: Math.random() * 600,
speed: 2 + Math.random() * 3,
char: matrixChars[Math.floor(Math.random() * matrixChars.length)]
}));
​function drawParallaxBackground(ctx, level, cameraX) {
if (level === 1) {
// LEVEL 1: El Bosque Glitch (Endor Redwood Trees + Circuit corruptions)
let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
grad.addColorStop(0, '#021008');
grad.addColorStop(0.6, '#062613');
grad.addColorStop(1, '#020a05');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, canvas.width, canvas.height);
​// Distant Moon
ctx.save();
ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
ctx.shadowColor = '#00ff88';
ctx.shadowBlur = 25;
ctx.beginPath();
ctx.arc(650 - cameraX * 0.05, 120, 50, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
​// Matrix code rain (Distant)
ctx.fillStyle = 'rgba(0, 255, 102, 0.12)';
ctx.font = '10px monospace';
rainDrops.forEach(drop => {
ctx.fillText(drop.char, drop.x - cameraX * 0.15, drop.y);
drop.y += drop.speed;
if (drop.y > 600) drop.y = -20;
});
​// Layer 1: Distant Tree Silhouettes (Slow parallax)
ctx.fillStyle = '#081a0e';
for (let i = -100; i < 4000; i += 180) {
let drawX = i - cameraX * 0.2;
ctx.fillRect(drawX, 100, 45, 500);
// Foliage
ctx.beginPath();
ctx.arc(drawX + 22, 100, 60, 0, Math.PI * 2);
ctx.fill();
}
​// Layer 2: Midground Redwood Trees with Glitch Circuits
ctx.fillStyle = '#0f2f1a';
for (let i = -50; i < 4000; i += 320) {
let drawX = i - cameraX * 0.4;
ctx.fillRect(drawX, 0, 70, 600);
​// Glitching neon circuit lines on trunks
ctx.fillStyle = (Math.random() > 0.3) ? '#00ff66' : '#ffffff';
ctx.fillRect(drawX + 15, 150, 4, 180);
ctx.fillRect(drawX + 15, 220, 25, 4);
ctx.fillRect(drawX + 40, 220, 4, 90);
ctx.fillRect(drawX + 30, 380, 20, 4);
​// Tree bark details
ctx.fillStyle = '#0a2112';
ctx.fillRect(drawX + 5, 0, 8, 600);
ctx.fillRect(drawX + 58, 0, 8, 600);
ctx.fillStyle = '#0f2f1a';
}
​} else if (level === 2) {
// LEVEL 2: La Ciudad Holográfica (Synthwave / Cyberpunk Grid)
let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
grad.addColorStop(0, '#0a001a');
grad.addColorStop(0.5, '#190033');
grad.addColorStop(1, '#050010');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, canvas.width, canvas.height);
​// Cyan Synthwave Sun
ctx.save();
let sunGrad = ctx.createLinearGradient(0, 80, 0, 220);
sunGrad.addColorStop(0, '#ff00aa');
sunGrad.addColorStop(1, '#00ffff');
ctx.fillStyle = sunGrad;
ctx.shadowColor = '#00ffff';
ctx.shadowBlur = 20;
ctx.beginPath();
ctx.arc(400 - cameraX * 0.03, 160, 75, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
​// Holographic City Skyscraper Silhouettes
ctx.fillStyle = '#12002b';
for (let i = -100; i < 4000; i += 120) {
let drawX = i - cameraX * 0.25;
let bHeight = 180 + (Math.sin(i) * 90);
ctx.fillRect(drawX, 380 - bHeight, 75, bHeight);
​// Holographic windows
ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
for (let wy = 390 - bHeight; wy < 360; wy += 20) {
if ((i + wy) % 3 === 0) {
ctx.fillRect(drawX + 12, wy, 12, 10);
ctx.fillRect(drawX + 48, wy, 12, 10);
}
}
ctx.fillStyle = '#12002b';
}
​// Midground Floating Datapad Signs
for (let i = 200; i < 4000; i += 500) {
let drawX = i - cameraX * 0.5;
ctx.strokeStyle = '#ff00aa';
ctx.lineWidth = 2;
ctx.strokeRect(drawX, 180, 80, 45);
ctx.fillStyle = 'rgba(255, 0, 170, 0.15)';
ctx.fillRect(drawX, 180, 80, 45);
​ctx.fillStyle = '#00ffff';
ctx.font = '8px monospace';
ctx.fillText('HOLONET', drawX + 12, 205);
}
​// Cyber Grid Floor Horizon
ctx.strokeStyle = 'rgba(0, 255, 255, 0.35)';
ctx.lineWidth = 1;
let horizonY = 380;
for (let gx = -100; gx < 1000; gx += 40) {
ctx.beginPath();
ctx.moveTo(gx, 600);
ctx.lineTo(400 + (gx - 400) * 0.1, horizonY);
ctx.stroke();
}
for (let gy = horizonY; gy < 600; gy += 25) {
ctx.beginPath();
ctx.moveTo(0, gy);
ctx.lineTo(800, gy);
ctx.stroke();
}
​} else if (level === 3) {
// LEVEL 3: El Núcleo de Código (Giant Central Cyber Core)
let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
grad.addColorStop(0, '#000803');
grad.addColorStop(0.5, '#001a0a');
grad.addColorStop(1, '#000502');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, canvas.width, canvas.height);
​// Central Giant Glowing Matrix Core
let coreX = 1200 - cameraX * 0.2;
let coreY = 260;
ctx.save();
ctx.fillStyle = 'rgba(0, 255, 102, 0.15)';
ctx.shadowColor = '#00ff66';
ctx.shadowBlur = 40;
ctx.beginPath();
ctx.arc(coreX, coreY, 140, 0, Math.PI * 2);
ctx.fill();
​// Spinning Outer Rings
ctx.strokeStyle = '#00ff66';
ctx.lineWidth = 3;
let time = Date.now() * 0.002;
ctx.beginPath();
ctx.ellipse(coreX, coreY, 180, 50, time, 0, Math.PI * 2);
ctx.stroke();
ctx.beginPath();
ctx.ellipse(coreX, coreY, 180, 50, -time * 1.3, 0, Math.PI * 2);
ctx.stroke();
ctx.restore();
​// Dense Falling Binary Streams
ctx.fillStyle = 'rgba(0, 255, 102, 0.35)';
ctx.font = '11px monospace';
rainDrops.forEach((drop, idx) => {
let textChar = (idx % 2 === 0) ? "1" : "0";
ctx.fillText(textChar, drop.x - cameraX * 0.4, drop.y);
drop.y += drop.speed * 1.8;
if (drop.y > 600) drop.y = -20;
});
​// Digital Lightning Pulses
if (Math.random() > 0.82) {
ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(coreX, coreY);
ctx.lineTo(coreX + (Math.random() - 0.5) * 300, coreY + (Math.random() - 0.5) * 300);
ctx.stroke();
}
}
}
​class Ewok {
constructor(x, y) {
this.x = x;
this.y = y;
this.width = 32;
this.height = 36;
this.vx = 0;
this.vy = 0;
this.speed = 4.2;
this.jumpPower = -12.8;
this.gravity = 0.52;
this.isGrounded = false;
this.facing = 'right';
this.lives = 3;
​this.isAttacking = false;
this.attackTimer = 0;
this.attackCooldown = 0;
​this.activePowerUp = null;
this.powerUpTimer = 0;
this.invulnerable = false;
this.invulnerableTimer = 0;
​this.animFrame = 0;
this.animTimer = 0;
}
​reset(x, y) {
this.x = x;
this.y = y;
this.vx = 0;
this.vy = 0;
this.isGrounded = false;
this.isAttacking = false;
this.activePowerUp = null;
this.powerUpTimer = 0;
this.invulnerableTimer = 0;
}
​applyPowerUp(type) {
this.activePowerUp = type;
this.powerUpTimer = 600;
audio.playPowerup();
​if (type === 'gold') {
this.invulnerable = true;
}
}
​update(platforms) {
if (this.powerUpTimer > 0) {
this.powerUpTimer--;
if (this.powerUpTimer <= 0) {
this.activePowerUp = null;
this.invulnerable = false;
}
}
​if (this.invulnerableTimer > 0) {
this.invulnerableTimer--;
}
​const currentSpeed = (this.activePowerUp === 'cartridge') ? this.speed * 1.5 : this.speed;
const currentJump = (this.activePowerUp === 'cartridge') ? this.jumpPower * 1.2 : this.jumpPower;
​if (keys.left) {
this.vx = -currentSpeed;
this.facing = 'left';
} else if (keys.right) {
this.vx = currentSpeed;
this.facing = 'right';
} else {
this.vx *= 0.65;
}
​if (keys.jump && this.isGrounded) {
this.vy = currentJump;
this.isGrounded = false;
audio.playJump();
}
​this.vy += this.gravity;
​this.x += this.vx;
this.collideX(platforms);
​this.y += this.vy;
this.collideY(platforms);
​if (keys.attack && this.attackCooldown <= 0) {
if (this.activePowerUp === 'cd') {
projectiles.push(new DiscProjectile(
this.facing === 'right' ? this.x + this.width + 2 : this.x - 16,
this.y + 10,
this.facing === 'right' ? 9 : -9
));
audio.playShoot();
} else {
this.isAttacking = true;
this.attackTimer = 15;
audio.playHit();
}
this.attackCooldown = 22;
}
​if (this.attackTimer > 0) {
this.attackTimer--;
if (this.attackTimer <= 0) this.isAttacking = false;
}
​if (this.attackCooldown > 0) {
this.attackCooldown--;
}
​this.animTimer++;
if (this.animTimer % 8 === 0) {
this.animFrame = (this.animFrame + 1) % 4;
}
​if (this.y > 680) {
this.takeDamage(1, true);
}
}
​collideX(platforms) {
for (let p of platforms) {
if (this.x < p.x + p.w && this.x + this.width > p.x &&
this.y < p.y + p.h && this.y + this.height > p.y) {
if (p.type === 'floating') continue;
​if (this.vx > 0) this.x = p.x - this.width;
else if (this.vx < 0) this.x = p.x + p.w;
}
}
}
​collideY(platforms) {
this.isGrounded = false;
for (let p of platforms) {
if (this.x + this.width > p.x + 4 && this.x < p.x + p.w - 4) {
if (this.vy >= 0 && (this.y + this.height - this.vy) <= p.y + 12 && (this.y + this.height) >= p.y) {
this.y = p.y - this.height;
this.vy = 0;
this.isGrounded = true;
} else if (this.vy < 0 && p.type === 'ground' && this.y < p.y + p.h && this.y > p.y) {
this.y = p.y + p.h;
this.vy = 0;
}
}
}
}
​takeDamage(amount, instantRespawn = false) {
if ((this.invulnerable || this.invulnerableTimer > 0) && !instantRespawn) return;
​this.lives -= amount;
audio.playHit();
updateHUD();
​if (this.lives <= 0) {
currentState = GAME_STATES.GAMEOVER;
} else {
this.invulnerableTimer = 90;
if (instantRespawn) {
this.x = 100;
this.y = 250;
this.vx = 0;
this.vy = 0;
}
}
}
​draw(ctx) {
if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 5) % 2 === 0) {
return;
}
​ctx.save();
ctx.translate(this.x - cameraX, this.y);
​if (this.activePowerUp === 'gold') {
ctx.shadowColor = ['#00ff66', '#ffff00', '#ff00ff', '#00ffff'][Math.floor(Date.now() / 100) % 4];
ctx.shadowBlur = 15;
} else if (this.activePowerUp === 'cartridge') {
ctx.shadowColor = '#00ffff';
ctx.shadowBlur = 8;
}
​if (this.facing === 'left') {
ctx.translate(this.width, 0);
ctx.scale(-1, 1);
}
​// Hood
ctx.fillStyle = '#d96b27';
ctx.fillRect(4, 2, 24, 18);
ctx.fillRect(2, 6, 28, 12);
​// Face
ctx.fillStyle = '#8b5a2b';
ctx.fillRect(8, 8, 16, 12);
​// Ears
ctx.fillStyle = '#d96b27';
ctx.fillRect(2, 0, 6, 6);
ctx.fillRect(24, 0, 6, 6);
​// Eyes
ctx.fillStyle = (this.activePowerUp === 'gold') ? '#00ff66' : '#000000';
ctx.fillRect(10, 10, 4, 4);
ctx.fillRect(18, 10, 4, 4);
​// Snout
ctx.fillStyle = '#5c3a1e';
ctx.fillRect(13, 14, 6, 4);
​// Body
ctx.fillStyle = '#5c3b1e';
ctx.fillRect(6, 20, 20, 12);
​// Legs
ctx.fillStyle = '#3d2613';
let legOffset = (Math.abs(this.vx) > 0.5 && !this.isGrounded === false) ? (this.animFrame % 2) * 2 : 0;
ctx.fillRect(8, 32 - legOffset, 6, 4 + legOffset);
ctx.fillRect(18, 32 + legOffset - 2, 6, 4 - legOffset + 2);
​// Spear
ctx.fillStyle = '#8b5a2b';
let spearAngle = this.isAttacking ? 12 : 0;
ctx.fillRect(22 + spearAngle, 10, 4, 24);
​// Spear Tip
ctx.fillStyle = '#00ff66';
ctx.fillRect(21 + spearAngle, 4, 6, 6);
​if (this.isAttacking) {
ctx.fillStyle = 'rgba(0, 255, 102, 0.6)';
ctx.beginPath();
ctx.arc(28, 16, 18, -Math.PI/3, Math.PI/3);
ctx.fill();
}
​ctx.restore();
}
}
​class GlitchBug {
constructor(x, y, distance = 100) {
this.x = x;
this.y = y;
this.startX = x;
this.maxDistance = distance;
this.width = 28;
this.height = 24;
this.vx = 1.2;
this.alive = true;
this.anim = 0;
}
​update() {
if (!this.alive) return;
this.x += this.vx;
if (Math.abs(this.x - this.startX) > this.maxDistance) {
this.vx *= -1;
}
this.anim += 0.1;
}
​draw(ctx) {
if (!this.alive) return;
ctx.save();
ctx.translate(this.x - cameraX, this.y);
​ctx.fillStyle = '#00ff66';
ctx.shadowColor = '#00ff66';
ctx.shadowBlur = 6;
​ctx.fillRect(4, 6, 20, 14);
​if (Math.random() > 0.7) {
ctx.fillStyle = '#ffffff';
ctx.fillRect(2 + Math.random()*4, 2, 24, 4);
}
​ctx.fillStyle = '#ff0055';
ctx.fillRect(6, 8, 4, 4);
ctx.fillRect(18, 8, 4, 4);
​ctx.fillStyle = '#00cc55';
let legShift = Math.sin(this.anim) * 3;
ctx.fillRect(0, 18 + legShift, 6, 6);
ctx.fillRect(11, 18 - legShift, 6, 6);
ctx.fillRect(22, 18 + legShift, 6, 6);
​ctx.restore();
}
}
​class FlyingHologram {
constructor(x, y, rangeY = 50) {
this.x = x;
this.y = y;
this.startY = y;
this.rangeY = rangeY;
this.width = 30;
this.height = 30;
this.angle = 0;
this.alive = true;
this.shootCooldown = 130;
}
​update(playerX, playerY) {
if (!this.alive) return;
this.angle += 0.03;
this.y = this.startY + Math.sin(this.angle) * this.rangeY;
​this.shootCooldown--;
if (this.shootCooldown <= 0 && Math.abs(this.x - playerX) < 400) {
this.shootCooldown = 150;
const dirX = (playerX - this.x) > 0 ? 3.5 : -3.5;
enemyProjectiles.push(new LaserProjectile(this.x + 15, this.y + 15, dirX));
}
}
​draw(ctx) {
if (!this.alive) return;
ctx.save();
ctx.translate(this.x - cameraX, this.y);
​ctx.fillStyle = (Math.random() > 0.15) ? 'rgba(0, 240, 255, 0.8)' : 'rgba(255, 0, 255, 0.85)';
ctx.shadowColor = '#00f0ff';
ctx.shadowBlur = 10;
​ctx.beginPath();
ctx.moveTo(15, 0);
ctx.lineTo(30, 15);
ctx.lineTo(15, 30);
ctx.lineTo(0, 15);
ctx.closePath();
ctx.fill();
​ctx.fillStyle = '#ffffff';
ctx.fillRect(11, 11, 8, 8);
​ctx.restore();
}
}
​class DiscProjectile {
constructor(x, y, vx) {
this.x = x;
this.y = y;
this.vx = vx;
this.radius = 8;
this.active = true;
this.life = 120;
}
​update() {
this.x += this.vx;
this.life--;
if (this.life <= 0) this.active = false;
}
​draw(ctx) {
ctx.save();
ctx.translate(this.x - cameraX, this.y);
ctx.fillStyle = '#00ffff';
ctx.shadowColor = '#00ffff';
ctx.shadowBlur = 8;
ctx.beginPath();
ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = '#ffffff';
ctx.beginPath();
ctx.arc(0, 0, 3, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
}
}
​class LaserProjectile {
constructor(x, y, vx) {
this.x = x;
this.y = y;
this.vx = vx;
this.width = 12;
this.height = 4;
this.active = true;
}
​update() {
this.x += this.vx;
if (this.x < cameraX - 100 || this.x > cameraX + 900) this.active = false;
}
​draw(ctx) {
ctx.save();
ctx.translate(this.x - cameraX, this.y);
ctx.fillStyle = '#ff0055';
ctx.shadowColor = '#ff0055';
ctx.shadowBlur = 8;
ctx.fillRect(0, 0, this.width, this.height);
ctx.restore();
}
}
​class PowerUpItem {
constructor(x, y, type) {
this.x = x;
this.y = y;
this.width = 24;
this.height = 24;
this.type = type;
this.collected = false;
this.floatOffset = Math.random() * Math.PI;
}
​update() {
this.floatOffset += 0.05;
}
​draw(ctx) {
if (this.collected) return;
ctx.save();
let yPos = this.y + Math.sin(this.floatOffset) * 4;
ctx.translate(this.x - cameraX, yPos);
​if (this.type === 'cartridge') {
ctx.fillStyle = '#00aaff';
ctx.fillRect(2, 2, 20, 20);
ctx.fillStyle = '#ffffff';
ctx.fillRect(6, 4, 12, 8);
ctx.fillStyle = '#002244';
ctx.fillRect(6, 14, 12, 6);
} else if (this.type === 'cd') {
ctx.fillStyle = '#e0e0e0';
ctx.beginPath();
ctx.arc(12, 12, 10, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = '#00ff66';
ctx.beginPath();
ctx.arc(12, 12, 4, 0, Math.PI * 2);
ctx.fill();
} else if (this.type === 'gold') {
ctx.fillStyle = '#ffd700';
ctx.shadowColor = '#ffd700';
ctx.shadowBlur = 10;
ctx.fillRect(2, 2, 20, 20);
ctx.fillStyle = '#000000';
ctx.fillRect(6, 6, 12, 10);
}
​ctx.restore();
}
}
​let player = new Ewok(100, 250);
let platforms = [];
let enemies = [];
let powerups = [];
let projectiles = [];
let enemyProjectiles = [];
let levelExit = { x: 0, y: 0, width: 64, height: 90 };
let levelTotalWidth = 2400;
​function loadLevel(levelNum) {
platforms = [];
enemies = [];
powerups = [];
projectiles = [];
enemyProjectiles = [];
fireworkParticles = [];
cameraX = 0;
​player.reset(100, 250);
levelTotalWidth = 2200 + levelNum * 600;
​let currentX = 0;
while (currentX < levelTotalWidth) {
let sectionWidth = 350 + Math.random() * 200;
let groundY = 500;
platforms.push({ x: currentX, y: groundY, w: sectionWidth, h: 100, type: 'ground' });
​if (currentX > 300 && currentX < levelTotalWidth - 400 && Math.random() < 0.6) {
enemies.push(new GlitchBug(currentX + 50, groundY - 24, sectionWidth - 100));
}
​let gapWidth = 70 + Math.random() * 30;
currentX += sectionWidth + gapWidth;
}
​for (let x = 300; x < levelTotalWidth - 400; x += 180) {
let platY = 360 - Math.floor(Math.random() * 2) * 80;
let platW = 100 + Math.random() * 50;
​platforms.push({ x: x, y: platY, w: platW, h: 18, type: 'floating' });
​if (Math.random() < 0.35) {
let types = ['cartridge', 'cd', 'gold'];
let pType = types[Math.floor(Math.random() * types.length)];
powerups.push(new PowerUpItem(x + platW / 2 - 12, platY - 28, pType));
}
}
​for (let x = 600; x < levelTotalWidth - 400; x += 380) {
enemies.push(new FlyingHologram(x, 180 + Math.random() * 80));
}
​levelExit = {
x: levelTotalWidth - 220,
y: 410,
width: 70,
height: 90
};
​platforms.push({ x: levelTotalWidth - 300, y: 500, w: 300, h: 100, type: 'ground' });
​const levelNames = ['1 - BOSQUE GLITCH', '2 - CIUDAD HOLOGRÁFICA', '3 - NÚCLEO DE CÓDIGO'];
document.getElementById('level-display').innerText = levelNames[levelNum - 1];
​audio.playLevelStartMelody();
}
​function checkCollisions() {
enemies.forEach(enemy => {
if (!enemy.alive) return;
​if (player.isAttacking) {
let attackX = player.facing === 'right' ? player.x + player.width : player.x - 26;
if (attackX < enemy.x + enemy.width && attackX + 32 > enemy.x &&
player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
enemy.alive = false;
score += 150;
audio.playEnemyDie();
}
}
​if (player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
​if (player.invulnerable && player.activePowerUp === 'gold') {
enemy.alive = false;
score += 200;
audio.playEnemyDie();
} else if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 14) {
enemy.alive = false;
player.vy = player.jumpPower * 0.75;
score += 100;
audio.playEnemyDie();
} else {
player.takeDamage(1);
}
}
});
​projectiles.forEach(p => {
if (!p.active) return;
enemies.forEach(enemy => {
if (!enemy.alive) return;
if (p.x < enemy.x + enemy.width && p.x + p.radius > enemy.x &&
p.y < enemy.y + enemy.height && p.y + p.radius > enemy.y) {
enemy.alive = false;
p.active = false;
score += 150;
audio.playEnemyDie();
}
});
});
​enemyProjectiles.forEach(laser => {
if (!laser.active) return;
if (laser.x < player.x + player.width && laser.x + laser.width > player.x &&
laser.y < player.y + player.height && laser.y + laser.height > player.y) {
laser.active = false;
player.takeDamage(1);
}
});
​powerups.forEach(item => {
if (item.collected) return;
if (player.x < item.x + item.width && player.x + player.width > item.x &&
player.y < item.y + item.height && player.y + player.height > item.y) {
item.collected = true;
player.applyPowerUp(item.type);
score += 250;
}
});
​if (player.x + player.width > levelExit.x && player.x < levelExit.x + levelExit.width &&
player.y + player.height > levelExit.y && player.y < levelExit.y + levelExit.height) {
​if (currentLevel < maxLevels) {
audio.playLevelClearMelody();
currentState = GAME_STATES.LEVEL_CLEAR;
} else {
audio.playFinalVictoryMelody();
currentState = GAME_STATES.WIN;
}
}
​let progress = Math.min(100, Math.floor((player.x / levelExit.x) * 100));
document.getElementById('progress-display').innerText = PROGRESO: ${progress}%;
document.getElementById('score-display').innerText = score.toString().padStart(6, '0');
}
​function drawEnvironment() {
// Draw Custom Multi-Layer Background per level
drawParallaxBackground(ctx, currentLevel, cameraX);
​// Draw Platforms
platforms.forEach(p => {
ctx.save();
ctx.translate(p.x - cameraX, p.y);
​if (p.type === 'ground') {
if (currentLevel === 1) {
ctx.fillStyle = '#1c2d1f';
ctx.fillRect(0, 0, p.w, p.h);
ctx.fillStyle = '#00ff66';
ctx.fillRect(0, 0, p.w, 4);
} else if (currentLevel === 2) {
ctx.fillStyle = '#1a0033';
ctx.fillRect(0, 0, p.w, p.h);
ctx.fillStyle = '#00ffff';
ctx.fillRect(0, 0, p.w, 4);
} else {
ctx.fillStyle = '#002211';
ctx.fillRect(0, 0, p.w, p.h);
ctx.fillStyle = '#00ffaa';
ctx.fillRect(0, 0, p.w, 4);
}
​for (let cx = 15; cx < p.w - 10; cx += 50) {
ctx.fillStyle = (currentLevel === 2) ? '#ff00aa' : '#00aa44';
ctx.fillRect(cx, 10, 6, 6);
ctx.fillRect(cx + 2, 16, 2, 18);
}
} else {
ctx.fillStyle = (currentLevel === 2) ? 'rgba(0, 255, 255, 0.25)' : 'rgba(0, 255, 102, 0.25)';
ctx.strokeStyle = (currentLevel === 2) ? '#00ffff' : '#00ff66';
ctx.lineWidth = 2;
ctx.fillRect(0, 0, p.w, p.h);
ctx.strokeRect(0, 0, p.w, p.h);
}
ctx.restore();
});
​// Terminal Core Exit Portal
ctx.save();
ctx.translate(levelExit.x - cameraX, levelExit.y);
​let pulse = Math.sin(Date.now() / 150) * 8;
ctx.fillStyle = '#00ff66';
ctx.shadowColor = '#00ff66';
ctx.shadowBlur = 15 + pulse;
ctx.fillRect(0, 0, levelExit.width, levelExit.height);
​ctx.fillStyle = '#05150a';
ctx.fillRect(6, 6, levelExit.width - 12, levelExit.height - 12);
​ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#00ff66' : '#ffffff';
ctx.font = '9px "Press Start 2P"';
ctx.fillText('MATRIX', 8, 30);
ctx.fillText('CORE', 16, 48);
ctx.fillText('ENTRAR', 8, 70);
​ctx.restore();
}
​function updateHUD() {
const livesElem = document.getElementById('lives-display');
livesElem.innerHTML = '❤️'.repeat(Math.max(0, player.lives));
​const powerupHud = document.getElementById('powerup-hud');
if (player.activePowerUp) {
powerupHud.classList.remove('hidden');
const pNames = {
'cartridge': 'OVERCLOCK (SUPER SALTO)',
'cd': 'DISCOS LASER [X]',
'gold': 'INVULNERABLE MATRIX'
};
document.getElementById('powerup-name').innerText = pNames[player.activePowerUp];
document.getElementById('powerup-timer').innerText = Math.ceil(player.powerUpTimer / 60);
} else {
powerupHud.classList.add('hidden');
}
}
​function gameLoop() {
let targetCameraX = player.x - 220;
cameraX += (targetCameraX - cameraX) * 0.12;
if (cameraX < 0) cameraX = 0;
if (cameraX > levelTotalWidth - 800) cameraX = levelTotalWidth - 800;
​ctx.clearRect(0, 0, canvas.width, canvas.height);
​if (currentState === GAME_STATES.MENU) {
drawMenuScreen();
} else if (currentState === GAME_STATES.PLAYING) {
player.update(platforms);
​enemies.forEach(e => e.update(player.x, player.y));
powerups.forEach(p => p.update());
​projectiles.forEach(p => p.update());
projectiles = projectiles.filter(p => p.active);
​enemyProjectiles.forEach(ep => ep.update());
enemyProjectiles = enemyProjectiles.filter(ep => ep.active);
​checkCollisions();
updateHUD();
​drawEnvironment();
powerups.forEach(p => p.draw(ctx));
enemies.forEach(e => e.draw(ctx));
projectiles.forEach(p => p.draw(ctx));
enemyProjectiles.forEach(ep => ep.draw(ctx));
player.draw(ctx);
​} else if (currentState === GAME_STATES.LEVEL_CLEAR) {
drawLevelClearScreen();
} else if (currentState === GAME_STATES.GAMEOVER) {
drawGameOverScreen();
} else if (currentState === GAME_STATES.WIN) {
drawWinScreen();
}
​requestAnimationFrame(gameLoop);
}
​function drawMenuScreen() {
drawEnvironment();
ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
​ctx.fillStyle = '#00ff66';
ctx.shadowColor = '#00ff66';
ctx.shadowBlur = 12;
ctx.font = '28px "Press Start 2P"';
ctx.textAlign = 'center';
ctx.fillText('EWOK.EXE', canvas.width / 2, 180);
​ctx.font = '12px "Press Start 2P"';
ctx.fillStyle = '#ffffff';
ctx.shadowBlur = 0;
ctx.fillText('ENDOR MATRIX PLATFORMER', canvas.width / 2, 230);
​ctx.fillStyle = (Math.floor(Date.now() / 400) % 2 === 0) ? '#00ff66' : 'transparent';
ctx.fillText('PRESIONA ENTER / Z / TOCA PARA EMPEZAR', canvas.width / 2, 360);
​ctx.textAlign = 'left';
}
​function drawLevelClearScreen() {
ctx.fillStyle = 'rgba(0, 30, 15, 0.85)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
​ctx.fillStyle = '#00ff66';
ctx.shadowColor = '#00ff66';
ctx.shadowBlur = 12;
ctx.font = '24px "Press Start 2P"';
ctx.textAlign = 'center';
ctx.fillText(¡NIVEL ${currentLevel} COMPLETADO!, canvas.width / 2, 220);
​ctx.font = '12px "Press Start 2P"';
ctx.fillStyle = '#ffffff';
ctx.shadowBlur = 0;
ctx.fillText(PUNTUACIÓN: ${score}, canvas.width / 2, 290);
​ctx.fillStyle = '#ffff00';
ctx.fillText('PRESIONA ENTER O TOCA PARA SIGUIENTE NIVEL', canvas.width / 2, 380);
ctx.textAlign = 'left';
}
​function drawGameOverScreen() {
ctx.fillStyle = 'rgba(20, 0, 0, 0.85)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
​ctx.fillStyle = '#ff0055';
ctx.shadowColor = '#ff0055';
ctx.shadowBlur = 15;
ctx.font = '28px "Press Start 2P"';
ctx.textAlign = 'center';
ctx.fillText('SISTEMA CORRUMPIDO', canvas.width / 2, 220);
​ctx.font = '12px "Press Start 2P"';
ctx.fillStyle = '#ffffff';
ctx.shadowBlur = 0;
ctx.fillText(PUNTUACIÓN FINAL: ${score}, canvas.width / 2, 290);
​ctx.fillStyle = '#00ff66';
ctx.fillText('PRESIONA [R] O ENTER PARA REINTENTAR', canvas.width / 2, 370);
ctx.textAlign = 'left';
}
​function drawWinScreen() {
ctx.fillStyle = 'rgba(0, 20, 10, 0.9)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
​if (Math.random() < 0.12) {
createFireworkExplosion(100 + Math.random() * 600, 80 + Math.random() * 250);
}
​fireworkParticles.forEach(p => p.update());
fireworkParticles = fireworkParticles.filter(p => p.alpha > 0);
fireworkParticles.forEach(p => p.draw(ctx));
​ctx.fillStyle = '#00ff66';
ctx.shadowColor = '#00ff66';
ctx.shadowBlur = 15;
ctx.font = '26px "Press Start 2P"';
ctx.textAlign = 'center';
ctx.fillText('¡VICTORIA TOTAL!', canvas.width / 2, 180);
​ctx.font = '14px "Press Start 2P"';
ctx.fillStyle = '#ffff00';
ctx.shadowColor = '#ffff00';
ctx.shadowBlur = 10;
ctx.fillText('¡ENDOR HA SIDO PURGADO DE LA MATRIX!', canvas.width / 2, 230);
​ctx.font = '12px "Press Start 2P"';
ctx.fillStyle = '#ffffff';
ctx.shadowBlur = 0;
ctx.fillText(PUNTUACIÓN FINAL: ${score}, canvas.width / 2, 300);
​ctx.fillStyle = '#00ffff';
ctx.fillText('PRESIONA ENTER PARA JUGAR DE NUEVO', canvas.width / 2, 390);
ctx.textAlign = 'left';
}
​function startGame() {
audio.init();
score = 0;
currentLevel = 1;
player.lives = 3;
loadLevel(currentLevel);
currentState = GAME_STATES.PLAYING;
}
​function nextLevel() {
audio.init();
currentLevel++;
loadLevel(currentLevel);
currentState = GAME_STATES.PLAYING;
}
​function resetCurrentLevel() {
audio.init();
if (player.lives <= 0) player.lives = 3;
loadLevel(currentLevel);
currentState = GAME_STATES.PLAYING;
}
​window.addEventListener('keydown', (e) => {
audio.init();
if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') keys.jump = true;
if (e.code === 'KeyX' || e.code === 'KeyJ') keys.attack = true;
​if (e.code === 'KeyR') {
resetCurrentLevel();
}
​if (e.code === 'Enter') {
if (currentState === GAME_STATES.MENU || currentState === GAME_STATES.GAMEOVER || currentState === GAME_STATES.WIN) {
startGame();
} else if (currentState === GAME_STATES.LEVEL_CLEAR) {
nextLevel();
}
}
});
​window.addEventListener('keyup', (e) => {
if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') keys.jump = false;
if (e.code === 'KeyX' || e.code === 'KeyJ') keys.attack = false;
});
​const bindTouchBtn = (id, action) => {
const btn = document.getElementById(id);
btn.addEventListener('touchstart', (e) => {
e.preventDefault();
audio.init();
​if (currentState === GAME_STATES.MENU || currentState === GAME_STATES.GAMEOVER || currentState === GAME_STATES.WIN) {
startGame();
return;
} else if (currentState === GAME_STATES.LEVEL_CLEAR) {
nextLevel();
return;
}
​if (action === 'reset') {
resetCurrentLevel();
} else {
keys[action] = true;
}
});
​btn.addEventListener('touchend', (e) => {
e.preventDefault();
if (action !== 'reset') keys[action] = false;
});
};
​bindTouchBtn('btn-left', 'left');
bindTouchBtn('btn-right', 'right');
bindTouchBtn('btn-jump', 'jump');
bindTouchBtn('btn-attack', 'attack');
bindTouchBtn('btn-reset', 'reset');
​canvas.addEventListener('click', () => {
audio.init();
if (currentState === GAME_STATES.MENU || currentState === GAME_STATES.GAMEOVER || currentState === GAME_STATES.WIN) {
startGame();
} else if (currentState === GAME_STATES.LEVEL_CLEAR) {
nextLevel();
}
});
​window.onload = () => {
loadLevel(1);
gameLoop();
};

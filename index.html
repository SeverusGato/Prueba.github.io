<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ewok.exe - Endor Matrix Escape</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #050805;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 450px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4), 0 0 40px rgba(0, 0, 0, 0.8);
      border: 3px solid #00ff66;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* Touch Controls Overlay */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      height: 120px;
      pointer-events: none;
      z-index: 10;
    }
    .touch-btn {
      position: absolute;
      background: rgba(0, 255, 102, 0.2);
      border: 2px solid #00ff66;
      border-radius: 50%;
      color: #00ff66;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: rgba(0, 255, 102, 0.6);
      color: #000;
    }
    #btn-left { left: 15px; bottom: 15px; width: 55px; height: 55px; }
    #btn-right { left: 80px; bottom: 15px; width: 55px; height: 55px; }
    #btn-jump { right: 15px; bottom: 25px; width: 65px; height: 65px; }
    #btn-attack { right: 90px; bottom: 15px; width: 55px; height: 55px; }
    #btn-retry { left: 50%; transform: translateX(-50%); top: -40px; width: 90px; height: 35px; border-radius: 6px; font-size: 14px; display: none; }
    
    @media (max-width: 820px) {
      #game-container {
        width: 100vw;
        height: 56.25vw; /* 16:9 ratio */
        max-height: 100vh;
      }
      #touch-controls {
        display: block;
      }
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="btn-jump" class="touch-btn">▲</div>
    <div id="btn-attack" class="touch-btn">⚔</div>
    <div id="btn-retry" class="touch-btn">REINTENTO</div>
  </div>
</div>
